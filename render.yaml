# Render 배포 설정 (Blueprint)
# GitHub에 올린 저장소를 Render에 연결하면 이 파일대로 서버가 만들어진다.
services:
  - type: web
    name: dalmuti
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas 접속 주소 (Render 화면에서 직접 입력. 코드/저장소에는 넣지 않는다)
      - key: MONGODB_URI
        sync: false
